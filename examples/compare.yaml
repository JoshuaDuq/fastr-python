# Uncorrected scanner-artifact EEG vs FASTR-corrected EEG.
# Both folders are already processed; this command only pairs and plots.
#
# NOTE: uncorrected_root must hold EEG that has NOT had the gradient artifact
# removed. Pointing it at an already-corrected stage (an Analyzer step 1
# export, for example) makes the "Uncorrected" label and every *_fastr_ratio
# column compare two corrected datasets instead.

paths:
  uncorrected_root: /path/to/uncorrected
  fastr_root: /path/to/fastr
  output_root: /path/to/compare_output

plot:
  psd_max_hz: 100

subjects:
  include: []
  exclude: []
