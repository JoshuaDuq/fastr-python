# Complete volume-marker example. See docs/configuration.md for field rules.
input:
  raw_vhdr: /path/to/raw.vhdr
  fmri_metadata: /path/to/bold.json

output:
  vhdr: /path/to/corrected.vhdr

timing:
  marker_type: Volume
  marker_description: volume-start
  marker_kind: volume
  missing_volume_markers: error

processing:
  method: acquisition_group_fastr
  interpolation_factor: 10
  neighbor_count: 60
  search_radius_samples: 3
  pre_trigger_fraction: 0.03
  lowpass_hz: 100.0
  output_sampling_rate_hz: 1000.0
  channel_batch_size: 8
  reference_channel: EEG 001
  line_noise_frequencies_hz: [60.0]
  non_eeg_channels: [ECG]
  template_high_pass_hz: 1.0
  residual_threshold_uv: 1.0
  residual_gate: false
  residual_obs: false
  residual_obs_rank: 4
  residual_obs_section_seconds: null
  adaptive_noise_cancellation: false
  residual_gate_mad_multiplier: 8.0
  residual_gate_ratio: 8.0
  residual_gate_max_fraction: 0.02
  adaptive_window: false
  channel_adaptive_window: false
  local_window_channels: []
  local_neighbor_count: 20
  adaptive_improvement_ratio: 0.85
  channel_failure_policy: report

quality_control:
  block_seconds: 30.0
  mains_frequency_hz: 60.0
  mains_exclusion_hz: 1.0
  residual_mad_multiplier: 6.0
  residual_minimum_channels: 4
  report_channel_outliers: true
  bad_channel_residual_uv: 5.0
  volume_spectrum_max_hz: 110.0

diagnostics:
  psd_max_frequency_hz: 100.0
  psd_n_fft: null

trim:
  mode: first_to_last_volume
