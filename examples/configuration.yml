input:
  raw_vhdr: /path/to/raw.vhdr
  # Acquisition timing comes from exactly one place: this BIDS sidecar, the
  # `acquisition` section below, or the markers themselves when they are one
  # per acquisition group. Declaring two is an error rather than a precedence
  # rule, because the second could only contradict the first.
  fmri_metadata: /path/to/bold.json

output:
  vhdr: /path/to/corrected.vhdr

timing:
  marker_type: Volume
  marker_description: volume-start
  # `volume`: one marker begins a volume, and where each acquisition group fires
  #   inside it comes from the declared slice timing.
  # `slice`: every acquisition group is marked, so its position is read from the
  #   recording. Declare `groups_per_volume`, and no acquisition timing: the
  #   repetition time and the offsets are measured. See the block at the end of
  #   this file for that form.
  marker_kind: volume
  # Use repair only with an expected_volume_count. Only uniquely located
  # interior gaps are filled; missing boundary markers remain an error.
  missing_volume_markers: error
  # expected_volume_count: 580
  # When one marker stream contains multiple acquisitions, select the exact
  # zero-based range belonging to this BOLD run. Both fields are required and
  # the selected markers must still be contiguous; this never bridges a gap.
  # volume_marker_start_index: 0
  # volume_marker_count: 570
  # Marker selection requires trim.mode: first_to_last_volume below.

# Slice timing declared here instead of in a BIDS sidecar, for a recording whose
# sidecar omits SliceTiming or MultibandAccelerationFactor. The three fields are
# the BIDS ones and go through the same validation, so this is not a weaker
# declaration -- only a differently placed one. Remove input.fmri_metadata when
# using it.
#
# acquisition:
#   repetition_time_seconds: 0.9
#   slice_timing_seconds: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4,
#                          0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4]
#   multiband_acceleration_factor: 2

processing:
  method: acquisition_group_fastr
  interpolation_factor: 10
  neighbor_count: 60
  search_radius_samples: 3
  # Relative trigger location within an artifact: 0=start, 1=end.
  pre_trigger_fraction: 0.03
  # Set to 0.0 only when output_sampling_rate_hz equals the input rate.
  lowpass_hz: 100.0
  output_sampling_rate_hz: 1000.0
  channel_batch_size: 8
  reference_channel: EEG 001
  # Exact frequencies are removed by sinusoidal regression. Use [] to disable.
  line_noise_frequencies_hz: [60.0]
  # Channels that carry the gradient artifact but are not EEG. Their template is
  # subtracted unscaled and they are kept out of the residual basis and the line
  # regression, because a QRS complex biases anything fitted through it.
  non_eeg_channels: [ECG]
  template_high_pass_hz: 1.0
  # Absolute floor for the QC annotation: a block below this is never flagged
  # however far it sits from the channel median. Not a threshold on its own.
  residual_threshold_uv: 1.0
  residual_gate: false
  # FASTR stage 3. The basis is estimated per channel from a 70 Hz high-passed
  # copy of the residual and applied over whole volumes, because what it removes
  # is the volume-to-volume variability the template stage leaves behind.
  residual_obs: false
  # A positive integer or auto. Automatic selection uses the FMRIB knee rules.
  residual_obs_rank: 4
  # Null fits one basis over the run; a positive value refits by section.
  residual_obs_section_seconds: null
  # FASTR stage 4. Opt in only after checking narrowband signal transfer.
  adaptive_noise_cancellation: false
  residual_gate_mad_multiplier: 8.0
  residual_gate_ratio: 8.0
  residual_gate_max_fraction: 0.02
  adaptive_window: false
  # Decide between the wide and local windows independently for each EEG
  # channel. This cannot be combined with the shared adaptive_window mode.
  channel_adaptive_window: false
  # Force the local window across the full run only for listed EEG channels.
  # Use this for confirmed isolated residual failures such as AF4. This cannot
  # be combined with either adaptive-window mode.
  local_window_channels: []
  local_neighbor_count: 20
  adaptive_improvement_ratio: 0.85
  # Report only by default. The retry policy reruns isolated EEG failures with
  # local_neighbor_count, then recommends persistent failures in provenance.
  # It never interpolates or drops a channel, and cannot be combined with
  # either adaptive-window mode or with local_window_channels.
  channel_failure_policy: report

# Optional quality-control settings. These describe how residuals are measured;
# they do not enable or change correction stages by themselves.
quality_control:
  # Rounded down to a whole number of volumes so no block boundary falls
  # mid-acquisition.
  block_seconds: 30.0
  # 60.0 in North America, 50.0 in most of the rest of the world.
  mains_frequency_hz: 60.0
  mains_exclusion_hz: 1.0
  # A block is annotated only when its residual exceeds the channel's own
  # median by this many robust sigma, on at least this many channels at once.
  # The comparison is relative to the recording's own baseline, so a uniformly
  # noisy run is not flagged end to end for being noisy.
  residual_mad_multiplier: 6.0
  residual_minimum_channels: 4
  # Report isolated channel/block failures in the sidecar without marking the
  # entire time block bad or changing correction.
  report_channel_outliers: true
  # Absolute scanner-residual floor for automatic channel retry decisions. A
  # channel-block below this is never a candidate, however far it sits from the
  # other channels measured in the same block.
  bad_channel_residual_uv: 5.0
  # Highest volume harmonic reported, capped at the output Nyquist frequency.
  volume_spectrum_max_hz: 110.0

# Optional diagnostic settings. Set psd_n_fft to null to use the MNE default.
diagnostics:
  psd_max_frequency_hz: 100.0
  psd_n_fft: null

trim:
  mode: first_to_last_volume

# --- correcting from acquisition-group markers -------------------------------
#
# A recording that marks every excitation rather than every volume needs no
# declared slice timing at all: the group positions are recorded. Replace the
# `timing` section above with this, and remove both input.fmri_metadata and the
# acquisition section.
#
# timing:
#   marker_type: Slice
#   marker_description: slice-start
#   marker_kind: slice
#   # How many marked groups make one volume. Nothing in the marker series says
#   # where a volume begins, so this is the one number that must be declared.
#   groups_per_volume: 18
#   # Optional, and worth setting: a wrong groups_per_volume that still divides
#   # the marker count is self-consistent, and only a declared repetition time
#   # catches it. The usual mistake is counting slices where the scanner marks
#   # excitations, which measures a whole multiple of the repetition time.
#   expected_repetition_time_seconds: 0.9
