input:
  raw_vhdr: /path/to/raw.vhdr
  fmri_metadata: /path/to/bold.json

output:
  vhdr: /path/to/corrected.vhdr

timing:
  marker_type: Volume
  marker_description: volume-start
  # Use repair only with an expected_volume_count. Only uniquely located
  # interior gaps are filled; missing boundary markers remain an error.
  missing_volume_markers: error
  # expected_volume_count: 580

processing:
  method: acquisition_group_fastr
  interpolation_factor: 10
  neighbor_count: 60
  search_radius_samples: 3
  # Relative trigger location within an artifact: 0=start, 1=end.
  pre_trigger_fraction: 0.03
  # Set to 0.0 only when output_sampling_rate_hz equals the input rate.
  lowpass_hz: 100.0
  output_sampling_rate_hz: 1000.0
  channel_batch_size: 8
  reference_channel: EEG 001
  # Exact frequencies are removed by sinusoidal regression. Use [] to disable.
  line_noise_frequencies_hz: [60.0]
  # Channels that carry the gradient artifact but are not EEG. Their template is
  # subtracted unscaled and they are kept out of the residual basis and the line
  # regression, because a QRS complex biases anything fitted through it.
  non_eeg_channels: [ECG]
  template_high_pass_hz: 1.0
  # Absolute floor for the QC annotation: a block below this is never flagged
  # however far it sits from the channel median. Not a threshold on its own.
  residual_threshold_uv: 1.0
  residual_gate: false
  # FASTR stage 3. The basis is estimated per channel from a 70 Hz high-passed
  # copy of the residual and applied over whole volumes, because what it removes
  # is the volume-to-volume variability the template stage leaves behind.
  residual_obs: false
  # A positive integer or auto. Automatic selection uses the FMRIB knee rules.
  residual_obs_rank: 4
  # Null fits one basis over the run; a positive value refits by section.
  residual_obs_section_seconds: null
  # FASTR stage 4. Opt in only after checking narrowband signal transfer.
  adaptive_noise_cancellation: false
  residual_gate_mad_multiplier: 8.0
  residual_gate_ratio: 8.0
  residual_gate_max_fraction: 0.02
  adaptive_window: false
  local_neighbor_count: 20
  adaptive_improvement_ratio: 0.85

# Optional quality-control settings. These describe how residuals are measured;
# they do not enable or change correction stages by themselves.
quality_control:
  # Rounded down to a whole number of volumes so no block boundary falls
  # mid-acquisition.
  block_seconds: 30.0
  mains_frequency_hz: 60.0
  mains_exclusion_hz: 1.0
  # A block is annotated only when its residual exceeds the channel's own
  # median by this many robust sigma, on at least this many channels at once.
  # The comparison is relative to the recording's own baseline, so a uniformly
  # noisy run is not flagged end to end for being noisy.
  residual_mad_multiplier: 6.0
  residual_minimum_channels: 4

# Optional diagnostic settings. Set psd_n_fft to null to use the MNE default.
diagnostics:
  psd_max_frequency_hz: 100.0
  psd_n_fft: null

trim:
  mode: first_to_last_volume
