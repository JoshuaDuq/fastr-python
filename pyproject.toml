[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eegfmri-fastr"
version = "0.1.0"
description = "Validated scanner-gradient artifact correction for simultaneous EEG-fMRI"
license = "GPL-2.0-only"
readme = "README.md"
requires-python = ">=3.12"
# Ranges, so the package installs beside other analysis tools. The exact
# versions every published result was produced with are pinned in `uv.lock`;
# `uv sync` reproduces them. Python 3.12 is the tested interpreter.
dependencies = [
    "matplotlib>=3.8,<4",
    "mne>=1.9,<2",
    "numpy>=2.0,<3",
    "pybv>=0.8,<0.9",
    "pyyaml>=6.0,<7",
    "scipy>=1.11,<2",
]

[project.scripts]
eegfmri-fastr = "eegfmri_fastr.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/eegfmri_fastr"]
