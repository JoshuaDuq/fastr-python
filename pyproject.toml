[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastr-python"
version = "0.1.0"
description = "Validated scanner-gradient artifact correction for simultaneous EEG-fMRI"
authors = [{ name = "Joshua Duquette" }]
keywords = ["EEG", "fMRI", "FASTR", "BrainVision", "artifact correction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = "GPL-2.0-only"
readme = "README.md"
requires-python = ">=3.12"
# Ranges, so the package installs beside other analysis tools. The exact
# versions every published result was produced with are pinned in `uv.lock`;
# `uv sync` reproduces them. Python 3.12 is the tested interpreter.
dependencies = [
    "matplotlib>=3.8,<4",
    "mne>=1.9,<2",
    "numpy>=2.0,<3",
    "pybv>=0.8,<0.9",
    "pyyaml>=6.0,<7",
    "scipy>=1.11,<2",
]

[project.scripts]
fastr-python = "fastr_python.cli:main"

[project.urls]
Documentation = "https://github.com/JoshuaDuq/fastr-python/tree/main/docs"
Issues = "https://github.com/JoshuaDuq/fastr-python/issues"
Repository = "https://github.com/JoshuaDuq/fastr-python"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
extend-select = ["C90", "N", "D101", "D102", "D103", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103", "D401"]
"validation/**/*.py" = ["D101", "D102", "D103", "D401"]

[tool.hatch.build.targets.wheel]
packages = ["src/fastr_python"]
